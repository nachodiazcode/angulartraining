<div class="min-h-screen bg-slate-950 text-slate-100">
  <!-- Barra de navegación global -->
  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-900/85 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-3.5">
      <a routerLink="/" class="flex items-center gap-3 group">
        <span
          class="flex h-10 w-10 items-center justify-center rounded-full bg-red-500 font-extrabold text-white shadow-lg shadow-red-500/30 transition group-hover:scale-105"
        >
          P
        </span>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-white">Pokédex 2026</h1>
          <p class="text-xs text-slate-400">De Básico a Avanzado en Angular 22</p>
        </div>
      </a>

      <div class="flex flex-wrap items-center gap-3">
        <!-- Contador global sincronizado con TeamStore + localStorage -->
        <div
          class="hidden items-center gap-2 rounded-full border border-slate-800 bg-slate-950 px-3.5 py-1.5 text-xs sm:flex"
          title="Estado global compartido vía TeamStore"
        >
          <span class="text-slate-400">Mi Equipo:</span>
          <span class="font-bold text-amber-400">{{ teamStore.count() }} / 6</span>
        </div>

        <nav class="flex items-center gap-1.5 rounded-xl border border-slate-800 bg-slate-950/80 p-1">
          <a
            routerLink="/"
            routerLinkActive="bg-red-500 text-white shadow"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-4 py-1.5 text-sm font-semibold text-slate-300 transition hover:text-white"
          >
            Pokédex
          </a>
          <a
            routerLink="/tutorial"
            routerLinkActive="bg-red-500 text-white shadow"
            class="rounded-lg px-4 py-1.5 text-sm font-semibold text-slate-300 transition hover:text-white"
          >
            Tutorial (12 Módulos)
          </a>
        </nav>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
